[project]
name = "stacknest"
version = "0.1.0"
description = "A modular, stackable storage system for AMS 2 Pro, with or without AMS HT"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.4",
  "trimesh==5.2.1",
  "shapely==2.2.0",
  "manifold3d==3.5.5",
  "mapbox-earcut==2.1.0",
  "scipy>=1.15",
  "networkx>=3.4",
  "pillow>=11",
  "lxml>=5",
]

[dependency-groups]
docs = ["reportlab>=4.4", "pypdf>=5", "pymupdf>=1.25"]
